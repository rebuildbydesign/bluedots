<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blue Dots NYC – Interactive Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Header Bar -->
<header id="header-bar">
  <div class="header-left">
    <h1 class="header-title">Blue Dots NYC</h1>
    <span class="header-subtitle">Gowanus Pilot Map</span>
  </div>
  <div class="header-right">
    <span class="stat-number" id="counter-number">0</span>
    <span class="stat-label">gallons diverted</span>
    <span class="stat-tagline">Kept out of the sewer system</span>
  </div>
</header>

<div id="map"></div>

<!-- Unified Legend + Layer Panel -->
<div id="legend-panel">
  <h4>Map Layers</h4>

  <label class="layer-row" id="toggle-bluedots-row">
    <input type="checkbox" id="toggle-bluedots" checked>
    <span class="layer-swatch">
      <span class="legend-dot medium"></span>
    </span>
    <span class="layer-info">
      <span class="layer-name">Blue Dots</span>
      <span class="layer-desc">Resident stormwater projects</span>
    </span>
  </label>

  <label class="layer-row" id="toggle-outfalls-row">
    <input type="checkbox" id="toggle-outfalls" checked>
    <span class="layer-swatch">
      <span class="legend-cso"></span>
    </span>
    <span class="layer-info">
      <span class="layer-name">CSO Outfalls</span>
      <span class="layer-desc">Combined sewer overflow points</span>
    </span>
  </label>

  <label class="layer-row" id="toggle-drainage-row">
    <input type="checkbox" id="toggle-drainage" checked>
    <span class="layer-swatch">
      <span class="legend-drainage"></span>
    </span>
    <span class="layer-info">
      <span class="layer-name">OH-006 Drainage</span>
      <span class="layer-desc">Priority drainage area</span>
    </span>
  </label>

  <label class="layer-row" id="toggle-gi-row">
    <input type="checkbox" id="toggle-gi">
    <span class="layer-swatch">
      <span class="legend-gi"></span>
    </span>
    <span class="layer-info">
      <span class="layer-name">City Green Infrastructure</span>
      <span class="layer-desc">DEP green infrastructure assets</span>
    </span>
  </label>

  <label class="layer-row" id="toggle-sewersheds-row">
    <input type="checkbox" id="toggle-sewersheds">
    <span class="layer-swatch">
      <span class="legend-sewershed"></span>
    </span>
    <span class="layer-info">
      <span class="layer-name">OH 06 Sewer Shed</span>
      <span class="layer-desc">Full sewershed boundary</span>
    </span>
  </label>

  <div class="dot-sizes">
    <span class="dot-size-label">Dot size = gallons diverted:</span>
    <span class="legend-dot small"></span> <small>&lt;500</small>
    <span class="legend-dot medium"></span> <small>500–5k</small>
    <span class="legend-dot large"></span> <small>5k+</small>
  </div>
</div>

<!-- Mobile Info Button -->
<button id="map-info-btn" aria-label="Map info">ⓘ</button>

<!-- Mobile Info Popup -->
<div id="map-info-popup">
  <div class="info-title">Map Guide</div>
  <div class="info-item"><span class="legend-dot small"></span> Small Blue Dot: 1–500 gal</div>
  <div class="info-item"><span class="legend-dot medium"></span> Medium Blue Dot: 501–5,000 gal</div>
  <div class="info-item"><span class="legend-dot large"></span> Large Blue Dot: 5,000+ gal</div>
  <div class="info-item"><span class="legend-cso"></span> CSO Outfall</div>
  <div class="info-item"><span class="legend-gi"></span> City Green Infrastructure</div>
  <div class="info-item"><span class="legend-sewershed"></span> OH 06 Sewer Shed</div>
</div>


  <script src="scripts.js"></script>
</body>
</html>
